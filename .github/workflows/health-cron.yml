name: Health check cron

# Pings the deployed site's /api/cron/health endpoint on a schedule. Host-agnostic: it just
# curls a URL, so it works on Vercel, Cloudflare Workers, Fly, a VPS, or anywhere else.
#
# This is the scheduler even on serverless hosts. Vercel Cron on Hobby is capped at once per
# DAY (far too coarse for a pool health sweep), and Workers Cron on the free tier shares the
# same 10 ms-CPU/50-subrequest budget as a fetch request, so an HTTP-driven sweep is the only
# shape that runs everywhere. Keep this workflow as the real schedule; only move to a native
# platform cron where the budget allows, and delete this file if you do, so the sweep does not
# run twice.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   HEALTH_URL   - Base URL of the deployed site, e.g. https://archivepool.workers.dev
#   CRON_SECRET  - Same value as the CRON_SECRET secret on the deployed site.

on:
  schedule:
    # Every 6 hours. GitHub cron is UTC and may run a few minutes late under load.
    #
    # The cadence is set by Neon's compute budget, not by how fresh the pool feels. Every sweep
    # wakes the compute, and a wake keeps it running for its auto-suspend window (5 minutes by
    # default), so an hourly sweep burns ~2h/day = ~60h/month of the free tier's 100h — which the
    # app's own discovery traffic then pushes over, at which point Neon suspends the project and
    # every query starts failing. Four sweeps a day costs ~20 minutes/day (~10h/month) and leaves
    # real headroom for users. Lowering the project's auto-suspend window (e.g. to 1 minute) cuts
    # the per-wake cost further; do that before ever raising this frequency again.
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger health sweep (batched)
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$HEALTH_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "HEALTH_URL and CRON_SECRET secrets must be set." >&2
            exit 1
          fi
          # Strip any trailing slash so we don't produce a double slash.
          base="${HEALTH_URL%/}"
          # The sweep runs in bounded batches: request-budgeted hosts (Workers free
          # tier — ~50 subrequests / ~10 ms CPU per request) cannot run a full sweep
          # in one call, so each call runs up to 8 checks (12 consumed rows max —
          # no-verdict skips still spend subrequests) and returns a keyset cursor
          # that is passed back the next call, so skipped prefixes cannot starve
          # the tail. On hosts without those
          # limits the same loop simply finishes on the first pass. 40 passes
          # (320 checks) is far beyond the pool's size — hitting it means a batch
          # stopped making progress, which is a bug worth failing loudly for.
          cursor=""
          for i in $(seq 1 40); do
            code=$(curl -sS -o /tmp/body.txt -w "%{http_code}" -G \
              -H "Authorization: Bearer $CRON_SECRET" \
              --data-urlencode "batch=8" --data-urlencode "cursor=$cursor" \
              "$base/api/cron/health")
            echo "batch $i (cursor='$cursor'): HTTP $code"
            cat /tmp/body.txt
            echo
            # Fail the job on non-2xx so a broken deploy shows up as a red run.
            case "$code" in
              2*) ;;
              *) echo "Health sweep failed with HTTP $code" >&2; exit 1 ;;
            esac
            if [ "$(jq -r '.done' /tmp/body.txt)" = "true" ]; then
              echo "Health sweep complete after $i batch(es)."
              exit 0
            fi
            cursor=$(jq -er '.cursor' /tmp/body.txt 2>/dev/null) || cursor=""
            if [ -z "$cursor" ]; then
              echo "batch $i returned no sweep cursor — aborting" >&2
              exit 1
            fi
          done
          echo "Health sweep did not finish within 40 batches" >&2
          exit 1
