# SPDX-License-Identifier: GPL-3.0-or-later
name: TypeScript app
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  limits:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: local-test-fixture
          POSTGRES_DB: archivepool
        ports:
          - 55469:5432
        options: >-
          --health-cmd 'pg_isready -U postgres'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:local-test-fixture@127.0.0.1:55469/archivepool
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:limits
      - run: node tests/check-mutations.cjs
